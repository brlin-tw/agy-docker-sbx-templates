schemaVersion: "2"
kind: mixin
name: antigravity-auth
displayName: Antigravity Auth
description: Antigravity CLI configuration and active credentials

credentials:
  - service: antigravity
    description: Google OAuth session used by Antigravity CLI
    oauth:
      tokenEndpoint:
        host: oauth2.googleapis.com
        path: /token
      resourceHosts:
        - cloudaicompanion.googleapis.com
        - cloudcode-pa.googleapis.com
        - daily-cloudcode-pa.googleapis.com
        - generativelanguage.googleapis.com
      sentinels:
        accessToken: "antigravity-access-token"
        refreshToken: "antigravity-refresh-token"
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: "generativelanguage.googleapis.com"
          header: Authorization
          format: "Bearer %s"
        - domain: "*.googleapis.com"
          header: Authorization
          format: "Bearer %s"

permissions:
  network:
    allow:
      - "*.goog"
      - "*.google.com"
      - "*.googleapis.com"
      - "*.run.app"
      - "*.azureedge.net"
      - "accounts.google.com"
      - "antigravity.google"
      - "antigravity-unleash.goog"
      - "cloudaicompanion.googleapis.com"
      - "cloudcode-pa.googleapis.com"
      - "daily-cloudcode-pa.googleapis.com"
      - "generativelanguage.googleapis.com"
      - "oauth2.googleapis.com"
      - "www.googleapis.com"

setup:
  files:
    - path: /home/agent/.gemini/antigravity-cli/settings.json
      mode: 0600
      description: "Antigravity CLI configuration and active credentials"

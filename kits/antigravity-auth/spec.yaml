schemaVersion: "2"
kind: mixin
name: antigravity-auth
displayName: Antigravity Auth
description: Antigravity CLI configuration and active credentials

credentials:
  - service: antigravity
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: "generativelanguage.googleapis.com"
          header: Authorization
          format: "Bearer %s"
        - domain: "*.googleapis.com"
          header: Authorization
          format: "Bearer %s"

permissions:
  network:
    allow:
      - "*.goog"
      - "*.google.com"
      - "*.googleapis.com"
      - "*.run.app"
      - "*.azureedge.net"

setup:
  files:
    - path: /home/agent/.gemini/antigravity-cli/settings.json
      mode: 0600
      description: "Antigravity CLI configuration and active credentials"

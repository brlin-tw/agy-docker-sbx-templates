schemaVersion: "2"
kind: sandbox
name: antigravity
displayName: Google Antigravity
description: Google Antigravity agentic AI coding assistant

sandbox:
  image: "agy-docker-sbx-template:latest"
  entrypoint:
    - "agy"

permissions:
  network:
    allow:
      - "*.goog"
      - "*.google.com"
      - "*.googleapis.com"
      - "*.run.app"
      - "*.azureedge.net"

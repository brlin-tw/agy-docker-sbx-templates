# Copyright 2026 林博仁(Buo-ren Lin) <buo.ren.lin@gmail.com>
# SPDX-License-Identifier: AGPL-3.0-or-later
schemaVersion: "2"
kind: sandbox
name: antigravity
version: "1.0.0"
displayName: Google Antigravity
description: Google Antigravity agentic AI coding assistant
sourceURL: "https://gitlab.com/brlin/agy-docker-sbx-templates"
licenses:
  - AGPL-3.0-or-later

sandbox:
  image: "buorenlin/antigravity:latest"
  entrypoint:
    - "agy"

environment:
  variables:
    COLORTERM: "truecolor"
    LANG: "C.UTF-8"
    PAGER: "cat"
    TERM: "xterm-256color"

credentials:
  - service: antigravity
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: "generativelanguage.googleapis.com"
          header: Authorization
          format: "Bearer %s"
        - domain: "*.googleapis.com"
          header: Authorization
          format: "Bearer %s"

permissions:
  network:
    allow:
      - "*.azureedge.net"
      - "*.github.com"
      - "*.goog"
      - "*.google.com"
      - "*.googleapis.com"
      - "*.run.app"
      - "*.yarnpkg.com"
      - "archive.ubuntu.com"
      - "crates.io"
      - "download.docker.com"
      - "files.pythonhosted.org"
      - "github.com"
      - "gitlab.com"
      - "proxy.golang.org"
      - "pypi.org"
      - "registry.npmjs.org"
      - "security.ubuntu.com"
